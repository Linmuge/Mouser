name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag to create and publish a release for (e.g. v3.7.1). The tag is
          created at the built commit by the release job. Leave empty for a
          build-only dry run.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MOUSER_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || '' }}
  MOUSER_GIT_COMMIT: ${{ github.sha }}
  MOUSER_GIT_DIRTY: "false"
  MOUSER_WINDOWS_PUBLISHER: "Xingtai Muge Information Technology Co., Ltd."

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release identity and immutable tag target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || '' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            exit 0
          fi
          test "$GITHUB_REPOSITORY" = "Linmuge/Mouser"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_exists=true
            tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tag_target" = "$GITHUB_SHA"
          fi
          if release_json="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,targetCommitish 2>/dev/null)"; then
            test "$(jq -r .isDraft <<<"$release_json")" = "true"
            if [ "$tag_exists" = "false" ]; then
              draft_target="$(jq -r .targetCommitish <<<"$release_json")"
              draft_target_sha=""
              for ref in \
                  "$draft_target" \
                  "refs/heads/$draft_target" \
                  "refs/remotes/origin/$draft_target"; do
                if draft_target_sha="$(git rev-parse --verify --quiet \
                    --end-of-options "${ref}^{commit}" 2>/dev/null)"; then
                  break
                fi
              done
              test -n "$draft_target_sha"
              test "$draft_target_sha" = "$GITHUB_SHA"
            fi
          fi

  quality-python:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-util1 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1

      - name: Install locked release dependencies
        run: |
          python -m pip install --require-hashes --force-reinstall --no-deps -r requirements-release-build.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements-release.txt

      - name: Run Python quality gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q main_qml.py core ui tools
          python -m unittest discover -s tests -p "test_*.py"

  build-windows:
    needs: [preflight, quality-python]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked release dependencies
        run: |
          python -m pip install --require-hashes --force-reinstall --no-deps -r requirements-release-build.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements-release.txt

      - name: Run Windows tests
        run: |
          python -m compileall -q main_qml.py core ui tools
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build with PyInstaller
        run: python -m PyInstaller Mouser.spec --noconfirm

      - name: Sign and verify Windows binaries
        if: env.MOUSER_VERSION != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Release signing requires WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "mouser-release-signing.pfx"
          $catalogPath = Join-Path $env:RUNNER_TEMP "Mouser-Contents.cat"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "signtool.exe was not found" }
            $binaries = Get-ChildItem dist\Mouser -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.dll' }
            if (-not $binaries) { throw "No Windows binaries were produced" }
            foreach ($binary in $binaries) {
              & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $binary.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed to sign $($binary.FullName)" }
              & $signTool.FullName verify /pa /all $binary.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed to verify $($binary.FullName)" }
              $signature = Get-AuthenticodeSignature -LiteralPath $binary.FullName
              if ($null -eq $signature -or $null -eq $signature.SignerCertificate) {
                throw "No Authenticode signer certificate for $($binary.FullName)"
              }
              $publisher = $signature.SignerCertificate.GetNameInfo(
                [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
                $false
              )
              if ($signature.Status -ne 'Valid' -or $publisher -ne $env:MOUSER_WINDOWS_PUBLISHER) {
                throw "Unexpected Authenticode publisher for $($binary.FullName): $publisher"
              }
            }
            $bundlePath = (Resolve-Path -LiteralPath "dist\Mouser").Path
            New-FileCatalog `
              -Path $bundlePath `
              -CatalogFilePath $catalogPath `
              -CatalogVersion 2.0 | Out-Null
            $securePassword = ConvertTo-SecureString `
              $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Get-PfxCertificate `
              -FilePath $certificatePath `
              -Password $securePassword
            if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
              throw "The Windows signing certificate could not be loaded"
            }
            $catalogSigning = Set-AuthenticodeSignature `
              -LiteralPath $catalogPath `
              -Certificate $certificate `
              -HashAlgorithm SHA256 `
              -TimestampServer http://timestamp.digicert.com
            if ($null -eq $catalogSigning -or $catalogSigning.Status -ne 'Valid') {
              throw "Failed to sign the Windows content catalog"
            }
            $catalogSignature = Get-AuthenticodeSignature -LiteralPath $catalogPath
            if ($null -eq $catalogSignature -or
                $null -eq $catalogSignature.SignerCertificate) {
              throw "The Windows content catalog has no signer certificate"
            }
            $catalogPublisher = $catalogSignature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
            )
            if ($catalogSignature.Status -ne 'Valid' -or
                $catalogPublisher -ne $env:MOUSER_WINDOWS_PUBLISHER) {
              throw "Unexpected content catalog publisher: $catalogPublisher"
            }
            $bundledCatalog = Join-Path $bundlePath "Mouser-Contents.cat"
            Copy-Item -LiteralPath $catalogPath -Destination $bundledCatalog
            $catalogValidation = Test-FileCatalog `
              -CatalogFilePath $bundledCatalog `
              -Path $bundlePath `
              -FilesToSkip "Mouser-Contents.cat" `
              -Detailed
            if ($null -eq $catalogValidation -or
                $catalogValidation.Status -ne 'Valid' -or
                $catalogValidation.HashAlgorithm -ne 'SHA256') {
              throw "The signed Windows content catalog failed validation"
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
            Remove-Item $catalogPath -Force -ErrorAction SilentlyContinue
          }

      - name: Create archive
        run: Compress-Archive -Path dist\Mouser -DestinationPath Mouser-Windows.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mouser-Windows
          path: Mouser-Windows.zip

  build-macos:
    name: build-macos-native
    needs: [preflight, quality-python]
    runs-on: [self-hosted, macOS, mouser-release]
    timeout-minutes: 90
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run native quality gate
        working-directory: native/MouserNative
        shell: bash
        run: |
          xcodegen generate
          xcodebuild test \
            -project MouserNative.xcodeproj \
            -scheme MouserNative \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build, sign and notarize native universal DMGs
        shell: bash
        run: |
          version="${MOUSER_VERSION#v}"
          output_dir="$RUNNER_TEMP/mouser-native-$version"
          MOUSER_VERSION="$version" \
          MOUSER_OUTPUT_DIR="$output_dir" \
          MOUSER_NOTARY_PROFILE="Mouser-Notary" \
            native/MouserNative/release.sh
          mkdir -p native-release-assets
          cp "$output_dir"/Mouser-*.dmg native-release-assets/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mouser-macOS
          path: native-release-assets/Mouser-*.dmg

  build-linux:
    needs: [preflight, quality-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-util1 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1

      - name: Install locked release dependencies
        run: |
          python -m pip install --require-hashes --force-reinstall --no-deps -r requirements-release-build.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements-release.txt

      - name: Run Linux tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q main_qml.py core ui tools
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build with PyInstaller
        run: python -m PyInstaller Mouser-linux.spec --noconfirm

      - name: Audit Linux bundle dependencies
        run: |
          python - <<'PY'
          import os
          import pathlib
          import stat
          import subprocess

          bundle_root = os.path.join("dist", "Mouser")
          if not os.path.isdir(bundle_root):
              raise SystemExit(f"Missing bundle directory: {bundle_root}")

          bundle_root_path = pathlib.Path(bundle_root).resolve()
          internal_root = bundle_root_path / "_internal"
          pyside_root = internal_root / "PySide6"
          hidapi_root = internal_root / "hidapi.libs"

          def is_elf(path: str) -> bool:
              try:
                  mode = os.stat(path).st_mode
              except OSError:
                  return False
              if not stat.S_ISREG(mode):
                  return False
              with open(path, "rb") as fh:
                  return fh.read(4) == b"\x7fELF"

          library_dirs = []
          for root, _, files in os.walk(bundle_root):
              if any(".so" in name for name in files):
                  library_dirs.append(root)

          ld_library_path = ":".join(dict.fromkeys(library_dirs))
          env = os.environ.copy()
          if ld_library_path:
              env["LD_LIBRARY_PATH"] = ld_library_path

          def should_audit(path: pathlib.Path) -> bool:
              if path == bundle_root_path / "Mouser":
                  return True
              try:
                  relative = path.relative_to(pyside_root)
                  return "plugins" not in relative.parts and "qml" not in relative.parts
              except ValueError:
                  pass
              try:
                  path.relative_to(hidapi_root)
                  return True
              except ValueError:
                  return False

          missing = []
          for root, _, files in os.walk(bundle_root):
              for name in files:
                  path = pathlib.Path(root, name).resolve()
                  if not is_elf(str(path)) or not should_audit(path):
                      continue
                  result = subprocess.run(
                      ["ldd", str(path)],
                      check=False,
                      capture_output=True,
                      text=True,
                      env=env,
                  )
                  output = result.stdout + result.stderr
                  unresolved = [
                      line.strip()
                      for line in output.splitlines()
                      if "not found" in line
                  ]
                  if unresolved:
                      missing.append((path, unresolved))

          if missing:
              for path, unresolved in missing:
                  print(path)
                  for line in unresolved:
                      print(f"  {line}")
              raise SystemExit("Linux bundle contains unresolved shared-library dependencies")
          PY

      - name: Smoke test Linux bundle startup
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout --kill-after=5s 15s ./dist/Mouser/Mouser
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            exit "$status"
          fi

      - name: Add Linux permission helper
        run: |
          cp packaging/linux/69-mouser-logitech.rules dist/Mouser/
          cp packaging/linux/install-linux-permissions.sh dist/Mouser/
          chmod +x dist/Mouser/install-linux-permissions.sh

      - name: Create archive
        run: cd dist && zip -r -y ../Mouser-Linux.zip Mouser

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mouser-Linux
          path: Mouser-Linux.zip

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    environment: release-publishing
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Generate update metadata
        run: |
          mkdir -p update-assets
          cp Mouser-Windows/Mouser-Windows.zip update-assets/
          cp Mouser-macOS/Mouser-*.dmg update-assets/
          cp Mouser-Linux/Mouser-Linux.zip update-assets/
          python tools/generate_update_manifest.py \
            --repo "${{ github.repository }}" \
            --tag "${{ env.RELEASE_TAG }}" \
            --commit "${{ github.sha }}" \
            --asset-dir update-assets \
            --output "mouser-${{ env.RELEASE_TAG }}-update.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mouser-Update-Metadata
          path: mouser-${{ env.RELEASE_TAG }}-update.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            is_draft="$(gh release view "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              --json isDraft --jq .isDraft)"
            test "$is_draft" = "true"
            # Assets may only be replaced while the release is still a draft.
            gh release upload "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              --clobber \
              Mouser-Windows/Mouser-Windows.zip \
              Mouser-macOS/Mouser-*.dmg \
              Mouser-Linux/Mouser-Linux.zip \
              mouser-${{ env.RELEASE_TAG }}-update.json
            gh release edit "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              --target "$GITHUB_SHA" \
              --draft=false
          else
            # Checked-in notes win over auto-generated ones; a workflow_dispatch
            # run also creates the tag here (--target), since tag pushes are
            # not possible from every contributor environment.
            notes_file=".github/release-notes/${{ env.RELEASE_TAG }}.md"
            if [ -f "$notes_file" ]; then
              notes_args=(--notes-file "$notes_file")
            else
              notes_args=(--generate-notes)
            fi
            gh release create "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Mouser ${{ env.RELEASE_TAG }}" \
              "${notes_args[@]}" \
              Mouser-Windows/Mouser-Windows.zip \
              Mouser-macOS/Mouser-*.dmg \
              Mouser-Linux/Mouser-Linux.zip \
              mouser-${{ env.RELEASE_TAG }}-update.json
          fi
          git fetch --force origin \
            "refs/tags/${{ env.RELEASE_TAG }}:refs/tags/${{ env.RELEASE_TAG }}"
          published_target="$(git rev-list -n 1 "${{ env.RELEASE_TAG }}")"
          test "$published_target" = "$GITHUB_SHA"
          published_draft="$(gh release view "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --json isDraft --jq .isDraft)"
          test "$published_draft" = "false"
